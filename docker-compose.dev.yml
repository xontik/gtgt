# Builds the image from source instead of pulling it — use this to test
# Dockerfile/app changes before pushing. For just running the app, use
# docker-compose.yml (pulls the published GHCR image) instead:
#
#   docker compose -f docker-compose.dev.yml up -d --build
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=file:/data/gtg.sqlite
      - PORT=3001
      - APP_PASSCODE=${APP_PASSCODE:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://localhost:8080}
      - NOTIFY_CRON_SCHEDULE=${NOTIFY_CRON_SCHEDULE:-*/5 8-22 * * *}
      - BACKUP_CRON_SCHEDULE=${BACKUP_CRON_SCHEDULE:-0 3 * * *}
      - NOTIFY_TIMEZONE=${NOTIFY_TIMEZONE:-UTC}
      - NOTIFY_IDLE_HOURS=${NOTIFY_IDLE_HOURS:-1}
    volumes:
      - api_data:/data
    ports:
      - "${WEB_PORT:-8080}:3001"

volumes:
  api_data:
