services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=file:/data/gtg.sqlite
      - PORT=3001
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://localhost:8080}
      - NOTIFY_CRON_SCHEDULE=${NOTIFY_CRON_SCHEDULE:-0 8-22 * * *}
      - NOTIFY_IDLE_HOURS=${NOTIFY_IDLE_HOURS:-1}
    volumes:
      - api_data:/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  api_data:
