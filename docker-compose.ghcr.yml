# Standalone compose file for running published images — no repo clone
# needed. Download this file + .env.example (renamed to .env), fill in
# the .env, then:
#
#   docker compose -f docker-compose.ghcr.yml up -d
#
# To build from source instead, use docker-compose.yml in the repo.
services:
  api:
    image: ghcr.io/xontik/gtgt-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - DATABASE_URL=file:/data/gtg.sqlite
      - PORT=3001
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://localhost:8080}
      - NOTIFY_CRON_SCHEDULE=${NOTIFY_CRON_SCHEDULE:-*/5 8-22 * * *}
      - NOTIFY_TIMEZONE=${NOTIFY_TIMEZONE:-UTC}
      - NOTIFY_IDLE_HOURS=${NOTIFY_IDLE_HOURS:-1}
    volumes:
      - api_data:/data

  web:
    image: ghcr.io/xontik/gtgt-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  api_data:
